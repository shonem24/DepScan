[package]
name = "lsp-dep-extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lsp-dep-extractor"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
indicatif    = "0.17"
clap         = { version = "4", features = ["derive"] }
ignore       = "0.4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tree-sitter  = "0.25"
tree-sitter-python     = "0.23"
tree-sitter-java       = "0.23"
tree-sitter-rust       = "0.23"
tree-sitter-typescript = "0.23"
